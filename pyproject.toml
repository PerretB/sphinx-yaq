[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-yaq"
version = "0.1.0"
description = "Interactive self-assessment quizzes for Sphinx HTML documentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Benjamin Perret" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Sphinx :: Extension",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "Sphinx>=7",
]

[project.urls]
Documentation = "https://github.com/PerretB/sphinx-yaq"
Source = "https://github.com/PerretB/sphinx-yaq"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinx_yaq = ["_static/**/*"]
